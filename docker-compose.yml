# Запуск: cp deploy/.env.example .env && (отредактировать) && docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ENV: production
    volumes:
      - clubs-data:/data
      - clubs-backups:/backups
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; h=os.environ['ALLOWED_HOSTS'].split(',')[0].strip(); r=urllib.request.Request('http://127.0.0.1:8000/readyz',headers={'Host':h}); urllib.request.urlopen(r,timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file: .env
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  clubs-data:
  clubs-backups:
  caddy-data:
  caddy-config:
