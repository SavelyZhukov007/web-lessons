<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Расписание кружков КИПФИН: занятия, руководители, аудитории, отмены и переносы.">
    <title>Расписание — KipClub</title>
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="/manifest.webmanifest?v=kc5">
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg?v=kc4">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=kc4">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=kc4">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=kc4">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="KipClub">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="/js/theme-init.js"></script>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/campus.css?v=kc12">
    <link rel="stylesheet" href="/css/schedule.css?v=kc13">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/platform.css">
    <link rel="stylesheet" href="/css/schedule-controls.css">
    <link rel="preload" href="/fonts/GolosText-ui.woff2" as="font" type="font/woff2" crossorigin>
</head>

<body class="campus-page schedule-page">
    <a class="skip-link" href="#schedule-main">К содержимому</a>
    <header class="campus-header">
        <a class="campus-brand" href="/" aria-label="KipClub — главная"><span class="brand-mark" aria-hidden="true"></span><span>KipClub</span></a>
        <h1 class="schedule-title">Расписание</h1>
        <a class="staff-link" href="/admin/login.html">Вход для сотрудников</a>
    </header>
    <main id="schedule-main" tabindex="-1">
        <form id="schedule-filters" role="search" aria-label="Поиск по расписанию">
            <label class="search-field"><span class="visually-hidden">Поиск по расписанию</span><span class="search-input"><svg
                        class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m20 20-4.5-4.5 M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0" />
                    </svg><input id="search" type="search" maxlength="200" data-schedule-search
                        placeholder="Кружок, руководитель, аудитория" autocomplete="off" enterkeyhint="search"
                        aria-controls="schedule-search-view"></span></label>
            <button id="search-exit" class="glass-action" type="button" aria-label="Закрыть поиск" hidden>Закрыть</button>
        </form>
        <div id="schedule-stage">
          <div id="schedule-overview">
            <div class="page-command">
            <div class="week-toolbar">
                <div class="week-navigation">
                    <button id="prev-week" class="icon-button glass-action" type="button" aria-label="Предыдущая неделя"><svg
                            class="ui-icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m14 6-6 6 6 6" />
                        </svg></button>
                    <div class="week-caption">
                        <h2 id="week-label">Расписание недели</h2>
                        <p id="week-year"></p>
                    </div>
                    <button id="next-week" class="icon-button glass-action" type="button" aria-label="Следующая неделя"><svg
                            class="ui-icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m10 6 6 6-6 6" />
                        </svg></button>
                </div>
                <div class="week-actions">
                    <label class="date-picker glass-action" title="Перейти к дате"><span class="visually-hidden">Перейти к дате</span><svg
                            class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3.5" y="5.5" width="17" height="15" rx="2" /><path d="M7.5 3.5v4m9-4v4M4 10h16" />
                        </svg><input id="week-date" type="date" min="2000-01-03" max="2100-12-31"></label>
                    <a id="print-week" class="print-week-link" href="/print.html" target="_blank" rel="noopener">Печать</a>
                </div>
            </div>
            <div class="desktop-view glass-tabs" role="group" aria-label="Вид расписания">
                <button id="view-grid" type="button" aria-pressed="true">Неделя</button>
                <button id="view-list" type="button" aria-pressed="false">Список</button>
            </div>
            </div>
            <div id="schedule-actions" class="schedule-actions" aria-label="Управление расписанием">
                <button id="toggle-filters" class="glass-action glass-trigger" type="button" aria-expanded="false"
                    aria-controls="filter-options" aria-label="Фильтры"><svg class="ui-icon " viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M4 7h16M4 17h16M8 4v6M16 14v6" />
                    </svg><span>Фильтры</span></button>
                <button id="today" class="glass-action" type="button" aria-pressed="false">Сегодня</button>
            </div>
            <section id="filter-options" class="filter-options glass-surface" aria-labelledby="filter-options-title" hidden>
                    <header class="filter-options-head">
                        <h3 id="filter-options-title">Фильтры</h3>
                        <button id="reset-filters" class="text-button" type="button" disabled>Сбросить</button>
                    </header>
                    <label>Направление<select id="category" class="glass-select">
                            <option value="">Любое</option>
                        </select></label>
                    <label>День<select id="weekday" class="glass-select">
                            <option value="">Все дни</option>
                            <option value="1">Понедельник</option>
                            <option value="2">Вторник</option>
                            <option value="3">Среда</option>
                            <option value="4">Четверг</option>
                            <option value="5">Пятница</option>
                            <option value="6">Суббота</option>
                        </select></label>
                    <label>Руководитель<select id="leader" class="glass-select">
                            <option value="">Любой</option>
                        </select></label>
                    <label>Аудитория<select id="room" class="glass-select">
                            <option value="">Любая</option>
                        </select></label>
            </section>
            <div id="filter-chips" class="filter-chips" aria-label="Активные фильтры" hidden></div>
            <div id="my-next" class="my-next" hidden></div>
            <div id="reference-error" class="reference-error" role="status" hidden><span></span><button
                    id="retry-references" type="button">Повторить загрузку фильтров</button></div>
            <div class="mobile-days glass-surface">
                <div id="day-buttons" class="glass-tabs" role="group" aria-label="Учебные дни"></div>
            </div>
            <div class="schedule-caption">
                <h2 id="selected-day-label" class="visually-hidden">Расписание занятий</h2>
                <p id="result-status" role="status" aria-live="polite" aria-atomic="true"></p>
            </div>
            <div id="content" class="schedule-content" aria-busy="true"></div>
          </div>
          <section id="schedule-search-view" aria-labelledby="schedule-search-title" hidden>
            <div class="search-heading">
                <h2 id="schedule-search-title">Поиск по расписанию</h2>
                <a class="glass-action search-catalog" href="/clubs.html">Все кружки</a>
            </div>
            <div id="search-scope" class="glass-tabs" role="group" aria-label="Период поиска">
                <button type="button" data-search-scope="day" aria-pressed="true">Этот день</button>
                <button type="button" data-search-scope="week" aria-pressed="false">Вся неделя</button>
            </div>
            <p id="search-status" role="status" aria-live="polite"></p>
            <div id="search-results"></div>
          </section>
        </div>
        <noscript>
            <p class="schedule-notice">Для просмотра расписания включи JavaScript в браузере.</p>
        </noscript>
    </main>
    <dialog id="event-dialog" aria-labelledby="event-title">
        <div id="event-details"></div><button id="close-event" type="button">Закрыть</button>
    </dialog>
    <script type="module" src="/js/schedule.js"></script>
    <script type="module" src="/js/settings.js"></script>
    <script type="module" src="/js/pwa-register.js"></script>
    <script type="module" src="/js/install-banner.js"></script>
</body>

</html>
