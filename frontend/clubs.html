<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Каталог кружков КИПФИН: направления, руководители, расписание.">
    <title>Кружки — KipClub</title>
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="/manifest.webmanifest?v=kc5">
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg?v=kc4">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=kc4">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=kc4">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=kc4">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="KipClub">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="/js/theme-init.js"></script>
        <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/campus.css?v=kc10">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="stylesheet" href="/css/platform.css">
</head>

<body class="campus-page">
    <a class="skip-link" href="#public-main">К содержимому</a>
    <header class="campus-header">
        <a class="campus-brand" href="/" aria-label="KipClub — главная"><span class="brand-mark" aria-hidden="true"></span><span>KipClub</span></a>
        <nav aria-label="Основная навигация">
            <a href="/">Расписание</a>
            <a href="/clubs.html" aria-current="page">Все кружки</a>
        </nav>
        <a class="staff-link" href="/admin/login.html">Вход для сотрудников</a>
    </header>
    <main id="public-main" tabindex="-1">
        <div class="public-title">
            <h1>Кружки</h1>
            <p id="clubs-count" class="directory-meta" role="status" aria-live="polite"></p>
        </div>
        <form id="club-filters" class="club-filters" role="search" aria-label="Поиск кружков">
            <label class="field"><span class="field-label">Поиск</span><input id="club-search" type="search" maxlength="200" placeholder="Название или описание" autocomplete="off"></label>
            <label class="field"><span class="field-label">Направление</span><select id="club-category"><option value="">Все направления</option></select></label>
            <button id="club-reset" class="btn btn--text" type="button" hidden>Сбросить</button>
        </form>
        <div id="content" class="club-grid" aria-busy="true">
            <p class="directory-copy">Загружаем кружки…</p>
        </div>
    </main>
    <script type="module" src="/js/clubs.js"></script>
    <script type="module" src="/js/settings.js"></script>
    <script type="module" src="/js/pwa-register.js"></script>
    <script type="module" src="/js/install-banner.js"></script>
</body>

</html>
