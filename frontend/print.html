<!doctype html>
<html lang="ru" data-theme="light"> 
<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg?v=kc4">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=kc4">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=kc4">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=kc4">
    <title>Расписание — KipClub (Печатное)</title>
    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="./css/campus.css">
    <link rel="stylesheet" href="./css/print.css">
</head>
<body class="print-schedule-page">
    <div class="print-schedule-header">
        <div class="print-schedule-header-brand">
            <a class="campus-brand" href="/" aria-label="KipClub — главная">
                <span class="brand-mark" aria-hidden="true"></span>
                <span>KipClub</span>
            </a>
        </div>
        <div class="print-schedule-header-content">
            <h1>Расписание</h1>
            <div class="print-schedule-toolbar">
                <button id="print-button" class="schedule-button-print" type="button">
                    Распечатать
                </button>
                <button id="prev-button" class="schedule-button-nav" type="button" aria-label="Предыдущая неделя">
                    &lt;
                </button>
                <div class="schedule-week-caption" aria-live="polite"></div>
                <button id="next-button" class="schedule-button-nav" type="button" aria-label="Следующая неделя">
                    >
                </button>
            </div>
        </div>
    </div>
    <div class="print-schedule-content">
        <div class="print-schedule-week">
        </div>
    </div>
    <script type="module" src="./js/print.js"></script>
</body>
